spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Traces are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set
  # (e.g. http://otel-collector:4318/v1/traces).

app:
  security:
    jwt:
      # Set JWT_ISSUER_URI in every real environment; keys are then fetched from the issuer JWKS.
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${JWT_AUDIENCE:activation-service}
      # Local development only. Ignored when JWT_ISSUER_URI is set.
      dev-secret: ${JWT_DEV_SECRET:local-dev-secret-change-me-0123456789}
  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 3
    bulkhead:
      max-concurrent-calls: 4
      max-wait: 1s
  rate-limit:
    # Per client and per instance; the gateway keeps the global limit.
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:600}
    burst: ${RATE_LIMIT_BURST:50}
  processing:
    worker-enabled: ${WORKER_ENABLED:true}
    poll-interval: 1s
    # Batch must finish within the lease: ceil(batch-size / concurrency) x (connect + read timeout) < lease.
    batch-size: 8
    concurrency: 4
    lease: 30s
    max-attempts: 5
    retry-base-delay: 2s
    retry-max-delay: 5m
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval: 1s
    batch-size: 100
    retention: 7d
    purge-interval: 1h

# JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (the Docker image does).
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-} requestId=%X{requestId:-}]"
