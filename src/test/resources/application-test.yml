spring:
  datasource:
    url: jdbc:h2:mem:activation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  provider:
    base-url: http://localhost:${wiremock.port:65000}
    # Generous enough for a cold first call; the timeout test delays 2.5 s.
    read-timeout: 1s
    circuit-breaker:
      # Tests share one context; keep the breaker closed for provider error scenarios.
      minimum-number-of-calls: 1000
      sliding-window-size: 1000
  rate-limit:
    # Shared test context: effectively unlimited; RateLimitTest overrides it.
    burst: 100000
  processing:
    worker-enabled: false
  outbox:
    relay-enabled: false
