services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: activation
      POSTGRES_USER: activation
      POSTGRES_PASSWORD: activation
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activation -d activation"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8089", "--global-response-templating"]
    volumes:
      - ./provider-mock/mappings:/home/wiremock/mappings:ro
    ports:
      - "8089:8089"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/activation
      DB_USERNAME: activation
      DB_PASSWORD: activation
      PROVIDER_BASE_URL: http://provider-mock:8089
      JWT_DEV_SECRET: ${JWT_DEV_SECRET:-local-dev-secret-change-me-0123456789}
    ports:
      - "8080:8080"
